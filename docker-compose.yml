# Freebox Monitor : stack Dockhand.
# Coller ce fichier dans Dockhand, puis renseigner les variables d'environnement de la stack
# (APP_SECRET, et ADMIN_PASSWORD au premier démarrage). Aucun fichier à déposer sur le serveur.
# Notifications push : ouvrir l'interface en HTTPS (Nginx Proxy Manager, voir docs/https-npm.md).
services:
  freebox-monitor:
    image: ghcr.io/jhenninot/freebox-monitor-docker:latest
    container_name: freebox-monitor
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      # Chiffre le jeton Freebox et signe les sessions (openssl rand -hex 32). Ne plus le changer ensuite.
      APP_SECRET: ${APP_SECRET}
      # Facultatif : premier compte de l'interface, créé au premier démarrage s'il n'en existe aucun.
      # Ensuite les comptes sont en base (mot de passe haché) et ces variables peuvent être retirées.
      # Sans elles, le premier compte se crée depuis l'interface.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Adresse de la Freebox vue depuis le conteneur
      FREEBOX_URL: ${FREEBOX_URL:-http://mafreebox.freebox.fr}
      # Facultatif : contact donné aux services de push des navigateurs (mailto:... ou https://...)
      PUSH_SUBJECT: ${PUSH_SUBJECT:-}
      # Facultatif : adresse de ce serveur vue par la box (notifications de la box), réglable aussi dans l'interface
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "8086:8080"
    volumes:
      # Base SQLite + sauvegardes quotidiennes, gardées par Docker (volume nommé)
      - freebox-monitor-data:/data

volumes:
  freebox-monitor-data:
