name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du serveur
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Construction de l'interface
        working-directory: web
        run: |
          npm ci
          npm run build

      # Image Docker multi-architecture (amd64 + arm64) publiée sur ghcr.io à chaque push sur main.
      # arm64 sert aux VM de la Freebox Delta / Ultra.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push'
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version courte du commit
        if: github.event_name == 'push'
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Construire et publier l'image (amd64 + arm64)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/freebox-monitor-docker:latest
            ghcr.io/${{ github.repository_owner }}/freebox-monitor-docker:${{ steps.sha.outputs.short }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
