name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du serveur
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Construction de l'interface
        working-directory: web
        run: |
          npm ci
          npm run build

      # Image Docker publiée sur ghcr.io à chaque push sur main
      - name: Connexion à ghcr.io
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Construire et publier l'image
        if: github.event_name == 'push'
        run: |
          image=ghcr.io/${{ github.repository_owner }}/freebox-monitor-docker
          docker build -t "$image:latest" -t "$image:${GITHUB_SHA::7}" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} .
          docker push "$image:latest"
          docker push "$image:${GITHUB_SHA::7}"
